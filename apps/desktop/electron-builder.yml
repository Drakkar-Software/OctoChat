appId: software.drakkar.octochat
productName: OctoChat
directories:
  output: release
  buildResources: build
# Only the compiled shell + manifest go into the asar. The renderer (Expo web
# build) ships as an unpacked resource so the app:// handler can stream it.
files:
  - dist-electron/**/*
  - package.json
extraResources:
  - from: ../mobile/dist
    to: web
# No native modules → skip rebuild; keeps pnpm's hoisted layout happy.
npmRebuild: false
# Per-platform icons (.icns/.ico) are auto-generated from build/icon.png
# (1024x1024), so no explicit icon paths are needed below.
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Network
