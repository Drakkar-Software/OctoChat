appId: software.drakkar.octochat
productName: OctoChat
directories:
  output: release
  buildResources: build
# Only the compiled shell + manifest go into the asar. The renderer (Expo web
# build) ships as an unpacked resource so the app:// handler can stream it.
files:
  - dist-electron/**/*
  - package.json
extraResources:
  - from: ../mobile/dist
    to: web
# No native modules → skip rebuild; keeps pnpm's hoisted layout happy.
npmRebuild: false
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: build/icon.icns
win:
  target:
    - nsis
  icon: build/icon.ico
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Network
